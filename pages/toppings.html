  <main>
    <h1>配料</h1>
    <p class="lead">配料決定口感:Q彈、滑嫩、清脆,各有擁護者。</p>

    <section>
      <h2>常見配料口感表</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>配料</th><th>口感</th><th>適合搭配</th></tr>
          </thead>
          <tbody>
            <tr><td><img class="topping-icon" src="../assets/img/topping-pearl.svg" alt="珍珠(粉圓) Q版插圖"><span>珍珠(粉圓)</span></td><td>Q彈、有嚼勁</td><td>奶茶、鮮奶</td></tr>
            <tr><td><img class="topping-icon" src="../assets/img/topping-nata.svg" alt="椰果 Q版插圖"><span>椰果</span></td><td>脆彈、清爽</td><td>綠茶、水果茶</td></tr>
            <tr><td><img class="topping-icon" src="../assets/img/topping-grass-jelly.svg" alt="仙草 Q版插圖"><span>仙草</span></td><td>軟嫩、草本香</td><td>奶茶、紅茶</td></tr>
            <tr><td><img class="topping-icon" src="../assets/img/topping-aiyu.svg" alt="愛玉 Q版插圖"><span>愛玉</span></td><td>滑嫩、清爽</td><td>檸檬、水果茶</td></tr>
            <tr><td><img class="topping-icon" src="../assets/img/topping-pudding.svg" alt="布丁 Q版插圖"><span>布丁</span></td><td>綿滑、蛋奶香</td><td>奶茶、鮮奶茶</td></tr>
            <tr><td><img class="topping-icon" src="../assets/img/topping-cheese-foam.svg" alt="奶蓋 Q版插圖"><span>奶蓋</span></td><td>綿密、微鹹或微甜</td><td>烏龍茶、綠茶</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>小提醒</h2>
      <ul>
        <li>配料多半另外調味,加料會讓整杯更甜,可考慮調低甜度。</li>
        <li>珍珠建議趁新鮮喝完,放久口感會變硬。</li>
      </ul>
    </section>
